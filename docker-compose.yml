services:
  object_storage:
    container_name: object-storage
    profiles: ["object_storage"]
    build:
      context: ./object_storage
      dockerfile: docker/Dockerfile
    image: ${OBJECT_STORAGE_IMAGE:-object-storage:3.59}
    pull_policy: never
    # expose:
    #   - "8333"
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/ | grep -E '200|403' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - object_storage_data:/data
      - ./.runtime/object_storage/s3.json:/etc/object_storage/s3.json:ro

volumes:
  object_storage_data: