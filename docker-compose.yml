services:
  object_storage:
    container_name: object-storage
    profiles: ["object_storage"]
    build:
      context: ./object_storage
      dockerfile: Dockerfile
    image: ${OBJECT_STORAGE_IMAGE:-object-storage:3.59}
    pull_policy: never
    expose:
      - "8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - object_storage_data:/data

volumes:
  object_storage_data: